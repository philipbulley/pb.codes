[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "26.13.0"

# Pre-rendered pages are served as files. Anything else gets the SPA shell,
# which renders the not-found route on the client.
[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 404
